<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Vertical social cut with neon streaks and bokeh">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#12060a"/>
      <stop offset="0.55" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d1fe17" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#base)"/>
  <rect x="72" y="0" width="90" height="800" fill="url(#streak)" filter="url(#blur)"/>
  <rect x="300" y="0" width="60" height="800" fill="url(#streak)" filter="url(#blur)" opacity="0.7"/>
  <rect x="456" y="0" width="110" height="800" fill="url(#streak)" filter="url(#blur)" opacity="0.5"/>
  <circle cx="150" cy="230" r="26" fill="#e1fe68" fill-opacity="0.7" filter="url(#blur)"/>
  <circle cx="404" cy="368" r="18" fill="#d1fe17" fill-opacity="0.6" filter="url(#blur)"/>
  <circle cx="252" cy="560" r="12" fill="#ededed" fill-opacity="0.4" filter="url(#blur)"/>
  <circle cx="470" cy="640" r="22" fill="#b2d814" fill-opacity="0.5" filter="url(#blur)"/>
  <rect x="60" y="120" width="480" height="560" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="60" y="120" width="480" height="150" rx="28" fill="#000000" fill-opacity="0.25"/>
  <rect x="104" y="168" width="200" height="22" rx="11" fill="#ededed" fill-opacity="0.85"/>
  <rect x="104" y="206" width="300" height="14" rx="7" fill="#4a4a4a"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
