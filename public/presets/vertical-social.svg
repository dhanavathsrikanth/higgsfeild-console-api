<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Product jar on a color-blocked social set">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="blockA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#d8321c"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fc4c9"/>
      <stop offset="1" stop-color="#17878c"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset="0.5" stop-color="#e6e1d3"/>
      <stop offset="1" stop-color="#a8a191"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="key" cx="0.42" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.36"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
    </filter>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f2efe6"/>
      <stop offset="0.5" stop-color="#d8d3c5"/>
      <stop offset="1" stop-color="#8e887a"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="j1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.5" stop-color="#ded8ca"/>
      <stop offset="1" stop-color="#a49d8d"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.5" stop-color="#ded8c9"/>
      <stop offset="1" stop-color="#a49b88"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect x="0" y="86" width="600" height="300" fill="url(#blockA)"/>
  <rect x="0" y="386" width="600" height="240" fill="url(#blockB)"/>
  <rect width="600" height="800" fill="url(#key)"/>
  <rect y="626" width="600" height="174" fill="#0c0c0d"/>
  <ellipse cx="300" cy="646" rx="158" ry="28" fill="#000000" fill-opacity="0.42" filter="url(#soft)"/>
  <rect x="178.0" y="418" width="244" height="46" rx="14" fill="url(#lid)"/>
  <rect x="186.0" y="460" width="228" height="176" rx="16" fill="url(#jar)"/>
  <rect x="186.0" y="460" width="228" height="176" rx="16" fill="#000000" fill-opacity="0.08"/>
  <rect x="212.0" y="490" width="176" height="52" rx="6" fill="#f6f2e8" fill-opacity="0.92"/>
  <rect x="232.0" y="508" width="136" height="9" rx="4" fill="#1c1c1c" fill-opacity="0.72"/>
  <rect x="232.0" y="524" width="75" height="6" rx="3" fill="#1c1c1c" fill-opacity="0.34"/>
  <rect x="44" y="694" width="286" height="16" rx="8" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="44" y="724" width="180" height="16" rx="8" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="44" y="754" width="112" height="16" rx="8" fill="#d1fe17" fill-opacity="0.9"/>
  <rect width="600" height="800" fill="url(#vig)"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
