<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Motion streaks trailing a lime light source">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#121212"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#d1fe17" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e1fe68" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ededed" stop-opacity="0"/>
      <stop offset="1" stop-color="#ededed" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#base)"/>
  <rect y="150" width="1050" height="26" rx="13" fill="url(#streak)" filter="url(#blur)"/>
  <rect y="238" width="930" height="14" rx="7" fill="url(#streak)" opacity="0.7" filter="url(#blur)"/>
  <rect y="392" width="1010" height="34" rx="17" fill="url(#cool)" filter="url(#blur)"/>
  <rect y="470" width="820" height="10" rx="5" fill="url(#streak)" opacity="0.6" filter="url(#blur)"/>
  <rect y="560" width="960" height="18" rx="9" fill="url(#cool)" opacity="0.5" filter="url(#blur)"/>
  <circle cx="1010" cy="163" r="52" fill="#e1fe68" filter="url(#blur)"/>
  <circle cx="1010" cy="163" r="16" fill="#f4ffd6"/>
  <rect width="1200" height="675" filter="url(#grain)"/>
</svg>
