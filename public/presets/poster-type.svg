<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Typographic poster composition in lime and charcoal">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8ead10"/>
      <stop offset="1" stop-color="#e1fe68"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#base)"/>
  <rect x="56" y="96" width="196" height="26" rx="13" fill="#ededed" fill-opacity="0.9"/>
  <rect x="56" y="146" width="300" height="26" rx="13" fill="#4a4a4a"/>
  <rect x="56" y="196" width="120" height="26" rx="13" fill="#4a4a4a"/>
  <path d="M56 560 L544 300 L544 452 L56 712 Z" fill="url(#wedge)"/>
  <path d="M56 742 L544 482 L544 560 L56 820 Z" fill="#0e0e0e"/>
  <circle cx="472" cy="196" r="58" fill="none" stroke="#d1fe17" stroke-width="10"/>
  <circle cx="472" cy="196" r="18" fill="#d1fe17"/>
  <rect x="56" y="252" width="488" height="2" fill="#ffffff" fill-opacity="0.16"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
