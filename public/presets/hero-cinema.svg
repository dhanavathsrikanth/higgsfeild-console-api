<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cinematic lime horizon on a dark stage">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.6" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e1fe68" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d1fe17" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#base)"/>
  <circle cx="600" cy="330" r="300" fill="url(#sun)"/>
  <circle cx="600" cy="330" r="66" fill="#e1fe68" fill-opacity="0.9" filter="url(#soft)"/>
  <rect y="430" width="1200" height="245" fill="url(#ground)"/>
  <rect y="430" width="1200" height="3" fill="#d1fe17" fill-opacity="0.5"/>
  <rect y="118" width="1200" height="2" fill="#ffffff" fill-opacity="0.08"/>
  <rect y="560" width="1200" height="2" fill="#ffffff" fill-opacity="0.06"/>
  <ellipse cx="600" cy="440" rx="420" ry="60" fill="#d1fe17" fill-opacity="0.12" filter="url(#soft)"/>
  <rect width="1200" height="675" filter="url(#grain)"/>
</svg>
