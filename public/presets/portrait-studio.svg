<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Rim-lit studio portrait silhouette">
  <defs>
    <radialGradient id="base" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="0.6" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0.3">
      <stop offset="0" stop-color="#e1fe68"/>
      <stop offset="0.4" stop-color="#d1fe17" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fill" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#base)"/>
  <ellipse cx="430" cy="240" rx="190" ry="190" fill="#d1fe17" fill-opacity="0.16" filter="url(#soft)"/>
  <path d="M300 190 c78 0 128 58 128 140 c0 74 -34 118 -60 142 c46 26 74 66 84 128 l16 92 h-336 l16 -92 c10 -62 38 -102 84 -128 c-26 -24 -60 -68 -60 -142 c0 -82 50 -140 128 -140 z" fill="url(#fill)"/>
  <path d="M300 190 c78 0 128 58 128 140 c0 74 -34 118 -60 142 c46 26 74 66 84 128 l16 92 h-52 l-14 -86 c-9 -56 -36 -94 -80 -118 c24 -22 56 -64 56 -132 c0 -76 -46 -132 -112 -134 z" fill="url(#rim)"/>
  <ellipse cx="300" cy="700" rx="180" ry="34" fill="#d1fe17" fill-opacity="0.12" filter="url(#soft)"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
