<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Split first-to-last frame transition with a lime divider">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#272727"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="right" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1fe17"/>
      <stop offset="0.45" stop-color="#8ead10"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#left)"/>
  <rect x="300" width="300" height="800" fill="url(#right)"/>
  <rect x="120" width="220" height="800" fill="url(#fade)"/>
  <circle cx="196" cy="300" r="72" fill="#4a4a4a" fill-opacity="0.5"/>
  <circle cx="196" cy="300" r="72" fill="none" stroke="#ededed" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="452" cy="520" r="120" fill="#e1fe68" fill-opacity="0.35" filter="url(#glow)"/>
  <rect x="298" width="4" height="800" fill="#e1fe68"/>
  <path d="M298 300 L266 372 L298 372 Z" fill="#ffffff"/>
  <path d="M302 500 L334 428 L302 428 Z" fill="#0e0e0e"/>
  <rect y="360" width="600" height="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
