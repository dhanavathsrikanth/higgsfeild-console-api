<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Warm window light across a quiet interior">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2a2418"/>
      <stop offset="0.5" stop-color="#141210"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#e1fe68" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#base)"/>
  <rect x="72" y="72" width="228" height="320" rx="8" fill="#e1fe68" fill-opacity="0.1"/>
  <path d="M72 72 L300 72 L156 620 L72 620 Z" fill="url(#shaft)" filter="url(#soft)"/>
  <path d="M300 72 L528 72 L384 620 L156 620 Z" fill="url(#shaft)" opacity="0.6" filter="url(#soft)"/>
  <ellipse cx="300" cy="632" rx="236" ry="60" fill="url(#pool)" filter="url(#soft)"/>
  <rect x="0" y="640" width="600" height="160" fill="#000000" fill-opacity="0.55"/>
  <rect x="366" y="560" width="150" height="86" rx="10" fill="#232323"/>
  <rect x="366" y="560" width="150" height="8" rx="4" fill="#d1fe17" fill-opacity="0.5"/>
  <circle cx="150" cy="330" r="7" fill="#d1fe17" fill-opacity="0.75"/>
  <circle cx="196" cy="270" r="4" fill="#ededed" fill-opacity="0.5"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
