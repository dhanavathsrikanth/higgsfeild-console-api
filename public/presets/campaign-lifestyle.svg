<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Product bottle in warm window light on a styled table">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1de"/>
      <stop offset="0.6" stop-color="#f0d9ba"/>
      <stop offset="1" stop-color="#d9b98f"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.5" stop-color="#ded8c9"/>
      <stop offset="1" stop-color="#a49b88"/>
    </linearGradient>
    <linearGradient id="pump" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99f6f"/>
      <stop offset="1" stop-color="#9d7549"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
    </filter>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f2efe6"/>
      <stop offset="0.5" stop-color="#d8d3c5"/>
      <stop offset="1" stop-color="#8e887a"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="j1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.5" stop-color="#ded8ca"/>
      <stop offset="1" stop-color="#a49d8d"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.5" stop-color="#ded8c9"/>
      <stop offset="1" stop-color="#a49b88"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#sun)"/>
  <g fill="#8a5f33" fill-opacity="0.16">
    <path d="M-40 90 L250 -60 L360 60 L70 210 Z"/>
    <path d="M330 -40 L640 120 L600 250 L300 90 Z"/>
    <path d="M-40 300 L160 190 L250 300 L40 420 Z"/>
  </g>
  <rect y="612" width="600" height="188" fill="url(#table)"/>
  <rect y="612" width="600" height="6" fill="#ffffff" fill-opacity="0.35"/>
  <ellipse cx="322" cy="644" rx="130" ry="26" fill="#000000" fill-opacity="0.3" filter="url(#soft)"/>
  <rect x="299" y="214" width="46" height="108" rx="8" fill="url(#pump)"/>
  <path d="M326 220 h40 a10 10 0 0 1 0 20 h-40 z" fill="url(#pump)"/>
  <path d="M255 358 q0 -40 67 -40 q67 0 67 40 v262 q0 24 -24 24 h-86 q-24 0 -24 -24 z" fill="url(#bottle)"/>
  <path d="M255 358 q0 -40 67 -40 q67 0 67 40 v262 q0 24 -24 24 h-86 q-24 0 -24 -24 z" fill="#000000" fill-opacity="0.10"/>
  <rect x="275.0" y="414" width="94" height="84" rx="6" fill="#f6f2e8" fill-opacity="0.92"/>
  <rect x="291.0" y="436" width="62" height="9" rx="4" fill="#1c1c1c" fill-opacity="0.72"/>
  <rect x="291.0" y="452" width="34" height="6" rx="3" fill="#1c1c1c" fill-opacity="0.34"/>
  <path d="M389 378 V600" stroke="#fff3d9" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M470 640 q42 -96 96 -128 q-14 84 -60 136 z" fill="#4e7a3f" fill-opacity="0.9"/>
  <path d="M470 640 q60 -40 108 -44 q-44 46 -74 60 z" fill="#3c6231" fill-opacity="0.9"/>
  <circle cx="140" cy="648" r="34" fill="#e6d6bd"/>
  <circle cx="140" cy="648" r="34" fill="#000000" fill-opacity="0.06"/>
  <rect width="600" height="800" fill="url(#vig)"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
