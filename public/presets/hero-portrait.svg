<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Three portrait frames lit from one source">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#e1fe68"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#base)"/>
  <circle cx="980" cy="150" r="220" fill="#d1fe17" fill-opacity="0.18" filter="url(#soft)"/>
  <g fill="url(#frame)">
    <rect x="120" y="110" width="250" height="455" rx="14"/>
    <rect x="475" y="110" width="250" height="455" rx="14"/>
    <rect x="830" y="110" width="250" height="455" rx="14"/>
  </g>
  <g fill="#050505">
    <circle cx="245" cy="270" r="62"/>
    <path d="M160 470 c0 -74 38 -120 85 -120 c47 0 85 46 85 120 z"/>
    <circle cx="600" cy="258" r="66"/>
    <path d="M510 470 c0 -78 40 -128 90 -128 c50 0 90 50 90 128 z"/>
    <circle cx="955" cy="280" r="58"/>
    <path d="M872 470 c0 -70 36 -114 83 -114 c47 0 83 44 83 114 z"/>
  </g>
  <g fill="url(#rim)">
    <path d="M305 210 c34 0 62 24 66 58 c4 30 -12 50 -26 62 l10 140 h-34 l-8 -136 c-12 -10 -22 -28 -22 -50 c0 -40 16 -74 14 -74 z"/>
    <path d="M666 196 c38 0 68 26 72 64 c4 32 -14 54 -30 66 l12 142 h-36 l-10 -138 c-14 -10 -26 -30 -26 -54 c0 -44 18 -80 18 -80 z"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14">
    <rect x="120" y="110" width="250" height="455" rx="14"/>
    <rect x="475" y="110" width="250" height="455" rx="14"/>
    <rect x="830" y="110" width="250" height="455" rx="14"/>
  </g>
  <rect width="1200" height="675" filter="url(#grain)"/>
</svg>
