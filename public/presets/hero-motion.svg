<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Product shot with light streaks for motion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141516"/>
      <stop offset="0.5" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1fe17" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f2efe6"/>
      <stop offset="0.5" stop-color="#d8d3c5"/>
      <stop offset="1" stop-color="#8e887a"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="key" cx="0.6" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.74">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.44"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
    </filter>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f2efe6"/>
      <stop offset="0.5" stop-color="#d8d3c5"/>
      <stop offset="1" stop-color="#8e887a"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="j1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.5" stop-color="#ded8ca"/>
      <stop offset="1" stop-color="#a49d8d"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.5" stop-color="#ded8c9"/>
      <stop offset="1" stop-color="#a49b88"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#key)"/>
  <g filter="url(#soft)">
    <rect x="60" y="368" width="560" height="8" rx="4" fill="url(#streak)"/>
    <rect x="140" y="410" width="470" height="6" rx="3" fill="url(#streak)" opacity="0.7"/>
    <rect x="220" y="452" width="360" height="5" rx="3" fill="url(#streak)" opacity="0.45"/>
  </g>
  <ellipse cx="770" cy="612" rx="176" ry="26" fill="#000000" fill-opacity="0.55" filter="url(#soft)"/>
  <rect x="690.0" y="216" width="160" height="30" rx="7" fill="url(#cap)"/>
  <rect x="698.0" y="238" width="144" height="342" rx="35" fill="url(#tube)"/>
  <rect x="727" y="562" width="86" height="44" rx="10" fill="url(#cap)"/>
  <rect x="698.0" y="238" width="144" height="342" rx="35" fill="#000000" fill-opacity="0.10"/>
  <rect x="712" y="366" width="116" height="109" rx="6" fill="#f6f2e8" fill-opacity="0.92"/>
  <rect x="728" y="395" width="84" height="10" rx="5" fill="#1c1c1c" fill-opacity="0.75"/>
  <rect x="728" y="424" width="50" height="6" rx="3" fill="#1c1c1c" fill-opacity="0.35"/>
  <circle cx="770" cy="460" r="13" fill="#1c1c1c" fill-opacity="0.6"/>
  <path d="M842 256 V594" stroke="#d1fe17" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M626 300 H820" stroke="#d1fe17" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <path d="M660 330 H844" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <rect width="1200" height="675" fill="url(#vig)"/>
  <rect width="1200" height="675" filter="url(#grain)"/>
</svg>
