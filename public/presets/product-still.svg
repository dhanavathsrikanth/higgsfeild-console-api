  <path d="M340 500 V800" stroke="#78b394" stroke-opacity="0.30" stroke-width="5"/>
  <path d="M416 500 V800" stroke="#78b394" stroke-opacity="0.30" stroke-width="5"/>
  <path d="M492 500 V800" stroke="#78b394" stroke-opacity="0.30" stroke-width="5"/>
  <path d="M568 500 V800" stroke="#78b394" stroke-opacity="0.30" stroke-width="5"/>
  <ellipse cx="300" cy="668" rx="168" ry="34" fill="#000000" fill-opacity="0.28" filter="url(#soft)"/>
  <circle cx="148" cy="646" r="56" fill="url(#tomato)"/>
  <ellipse cx="131" cy="627" rx="13" ry="9" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M148 592 l-16 -12 l18 4 l6 -14 l6 14 l18 -4 l-16 12 z" fill="#3f7d3a"/>
  <circle cx="462" cy="664" r="62" fill="url(#tomato)"/>
  <ellipse cx="443" cy="643" rx="15" ry="10" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M462 604 l-16 -12 l18 4 l6 -14 l6 14 l18 -4 l-16 12 z" fill="#3f7d3a"/>
  <circle cx="506" cy="574" r="40" fill="url(#tomato)"/>
  <ellipse cx="494" cy="560" rx="10" ry="6" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M506 536 l-16 -12 l18 4 l6 -14 l6 14 l18 -4 l-16 12 z" fill="#3f7d3a"/>
  <rect x="214.0" y="274" width="172" height="30" rx="7" fill="url(#tube2)"/>
  <rect x="222.0" y="296" width="156" height="342" rx="37" fill="url(#tube)"/>
  <rect x="253" y="620" width="94" height="44" rx="10" fill="url(#tube2)"/>
  <rect x="222.0" y="296" width="156" height="342" rx="37" fill="#000000" fill-opacity="0.10"/>
  <rect x="236" y="424" width="128" height="109" rx="6" fill="#f6f2e8" fill-opacity="0.92"/>
  <rect x="252" y="453" width="96" height="10" rx="5" fill="#1c1c1c" fill-opacity="0.75"/>
  <rect x="252" y="482" width="58" height="6" rx="3" fill="#1c1c1c" fill-opacity="0.35"/>
  <circle cx="300" cy="518" r="13" fill="#1c1c1c" fill-opacity="0.6"/>
  <path d="M378 314 V652" stroke="#ffd9c9" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
  <rect width="600" height="800" fill="url(#vig)"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
