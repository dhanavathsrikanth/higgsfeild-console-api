<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Concentric product orbit with a lime sweep">
  <defs>
    <radialGradient id="base" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.65" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#b2d814" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#d1fe17" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e1fe68" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ededed"/>
      <stop offset="0.5" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#base)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12">
    <ellipse cx="300" cy="400" rx="248" ry="248"/>
    <ellipse cx="300" cy="400" rx="196" ry="248"/>
    <ellipse cx="300" cy="400" rx="140" ry="248"/>
  </g>
  <path d="M52 400 A248 248 0 0 1 548 400" fill="none" stroke="url(#sweep)" stroke-width="6" stroke-linecap="round"/>
  <path d="M300 176 A224 224 0 0 1 300 624" fill="none" stroke="#d1fe17" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="300" cy="400" r="96" fill="url(#core)"/>
  <circle cx="300" cy="400" r="96" fill="none" stroke="#d1fe17" stroke-opacity="0.7" stroke-width="2"/>
  <ellipse cx="268" cy="372" rx="34" ry="22" fill="#ffffff" fill-opacity="0.28" filter="url(#glow)"/>
  <circle cx="336" cy="330" r="10" fill="#d1fe17"/>
  <circle cx="258" cy="500" r="7" fill="#e1fe68" fill-opacity="0.8"/>
  <circle cx="402" cy="470" r="5" fill="#b4b4b4" fill-opacity="0.7"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
