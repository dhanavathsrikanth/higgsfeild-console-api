<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Figure walking through volumetric light haze">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="0.55" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e1fe68" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d1fe17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3e3e3e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#base)"/>
  <path d="M120 0 L300 0 L420 640 L236 640 Z" fill="url(#beam)" filter="url(#soft)"/>
  <path d="M330 0 L470 0 L520 640 L402 640 Z" fill="url(#beam)" opacity="0.6" filter="url(#soft)"/>
  <circle cx="352" cy="236" r="40" fill="#171717"/>
  <path d="M330 288 h44 c26 0 44 20 46 46 l10 122 c2 26 -6 48 -22 62 l-24 22 -20 106 h-44 l-18 -106 -24 -22 c-16 -14 -24 -36 -22 -62 l10 -122 c2 -26 20 -46 44 -46 z" fill="url(#figure)"/>
  <path d="M330 288 h22 c-24 0 -42 20 -44 46 l-10 122 c-2 26 6 48 22 62 l24 22 20 106 h22 l-18 -106 -24 -22 c-16 -14 -24 -36 -22 -62 l10 -122 c2 -26 20 -46 40 -46 z" fill="#d1fe17" fill-opacity="0.14"/>
  <ellipse cx="352" cy="700" rx="150" ry="30" fill="#d1fe17" fill-opacity="0.1" filter="url(#soft)"/>
  <circle cx="120" cy="470" r="5" fill="#d1fe17" fill-opacity="0.8"/>
  <circle cx="500" cy="392" r="4" fill="#ededed" fill-opacity="0.5"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
