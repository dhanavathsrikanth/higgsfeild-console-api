<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Cream jar on a lime poster block">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e6"/>
      <stop offset="1" stop-color="#e9dfcc"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ff3d"/>
      <stop offset="1" stop-color="#a8cf16"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f2efe7"/>
      <stop offset="0.5" stop-color="#dcd6c8"/>
      <stop offset="1" stop-color="#a9a294"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
    </filter>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f2efe6"/>
      <stop offset="0.5" stop-color="#d8d3c5"/>
      <stop offset="1" stop-color="#8e887a"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="j1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.5" stop-color="#ded8ca"/>
      <stop offset="1" stop-color="#a49d8d"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.5" stop-color="#ded8c9"/>
      <stop offset="1" stop-color="#a49b88"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="216" fill="url(#block)"/>
  <rect x="64" y="600" width="472" height="152" rx="10" fill="#171717"/>
  <rect x="64" y="600" width="472" height="10" rx="5" fill="#ffffff" fill-opacity="0.14"/>
  <ellipse cx="300" cy="606" rx="150" ry="26" fill="#000000" fill-opacity="0.3" filter="url(#soft)"/>
  <rect x="182.0" y="386" width="236" height="46" rx="14" fill="url(#lid)"/>
  <rect x="190.0" y="428" width="220" height="168" rx="16" fill="url(#jar)"/>
  <rect x="190.0" y="428" width="220" height="168" rx="16" fill="#000000" fill-opacity="0.08"/>
  <rect x="216.0" y="458" width="168" height="52" rx="6" fill="#f6f2e8" fill-opacity="0.92"/>
  <rect x="236.0" y="476" width="128" height="9" rx="4" fill="#1c1c1c" fill-opacity="0.72"/>
  <rect x="236.0" y="492" width="70" height="6" rx="3" fill="#1c1c1c" fill-opacity="0.34"/>
  <rect x="64" y="766" width="300" height="14" rx="7" fill="#171717" fill-opacity="0.5"/>
  <rect x="64" y="790" width="180" height="14" rx="7" fill="#171717" fill-opacity="0.25"/>
  <rect width="600" height="800" fill="url(#vig)"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
